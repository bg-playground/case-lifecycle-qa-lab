<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">case-lifecycle-qa-lab</title>
  <desc id="d">Modern QA for case-management apps: a claim moves through Intake, Triage, Assessment, Settlement and Resolution, with each step checked by a test.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a4a"/>
      <stop offset="1" stop-color="#1f5fbf"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="60" y="98" font-size="52" font-weight="700" letter-spacing="-1">case-lifecycle-qa-lab</text>
    <text x="62" y="140" font-size="22" fill-opacity="0.85">Modern QA for case-management apps · mock DX API · Playwright · BGSTM traceability</text>
  </g>
  <!-- lifecycle: five stages, each with a passing check -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    <g transform="translate(60 190)">
      <rect width="170" height="56" rx="28" fill="#ffffff"/>
      <text x="85" y="35" text-anchor="middle" fill="#0f2a4a">Intake</text>
      <circle cx="160" cy="6" r="13" fill="#2fbf71"/><path d="M154 6l4 4 8-8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M238 218h32" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/><path d="M266 212l8 6-8 6" fill="#ffffff" fill-opacity="0.7"/>
    <g transform="translate(282 190)">
      <rect width="170" height="56" rx="28" fill="#ffffff"/>
      <text x="85" y="35" text-anchor="middle" fill="#0f2a4a">Triage</text>
      <circle cx="160" cy="6" r="13" fill="#2fbf71"/><path d="M154 6l4 4 8-8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M460 218h32" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/><path d="M488 212l8 6-8 6" fill="#ffffff" fill-opacity="0.7"/>
    <g transform="translate(504 190)">
      <rect width="190" height="56" rx="28" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.6"/>
      <text x="95" y="35" text-anchor="middle" fill="#ffffff">Assessment</text>
    </g>
    <path d="M702 218h32" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/><path d="M730 212l8 6-8 6" fill="#ffffff" fill-opacity="0.7"/>
    <g transform="translate(746 190)">
      <rect width="180" height="56" rx="28" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.6"/>
      <text x="90" y="35" text-anchor="middle" fill="#ffffff">Settlement</text>
    </g>
    <path d="M934 218h32" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/><path d="M962 212l8 6-8 6" fill="#ffffff" fill-opacity="0.7"/>
    <g transform="translate(978 190)">
      <rect width="170" height="56" rx="28" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.6"/>
      <text x="85" y="35" text-anchor="middle" fill="#ffffff">Resolution</text>
    </g>
  </g>
